services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    build: .
    env_file: .env
    depends_on: [db, redis]
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
  scheduler:
    build: .
    env_file: .env
    depends_on: [db, redis]
    command: python -m app.scheduler
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
